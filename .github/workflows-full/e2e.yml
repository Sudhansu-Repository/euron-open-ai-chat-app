# End to end on a real Android emulator against a real euron-open-ai-chat stack (its local
# AWS emulator and the model, image, speech and search stand-ins), driven by Maestro.
# Not run yet: the flows in e2e/flows have not been executed in this repository.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: euron-sde-team/euron-open-ai-chat
          path: .server
      - name: Start euron-open-ai-chat (make up, make demo)
        working-directory: .server
        run: |
          make up
          make demo | tee demo.txt
          echo "CHAT_DEMO_PASSWORD=$(grep -oE 'the password: +[^ ]+' demo.txt | awk '{print $NF}' | head -1)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile && cp .env.example .env
      # Metro runs on 8098 in this repository; bake that port into the debug build.
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
        env:
          RCT_METRO_PORT: "8098"
      - run: curl -fsSL "https://get.maestro.mobile.dev" | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            bash scripts/android-reverse.sh
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            pnpm start > metro.log 2>&1 &
            sleep 20
            maestro test --platform android -e DEMO_PASSWORD="$CHAT_DEMO_PASSWORD" e2e/flows
