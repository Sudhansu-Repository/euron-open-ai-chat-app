<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Euron Open AI Chat App</title>
  <desc id="d">Euron Open AI Chat App: the iOS and Android client for a self-hosted Euron Open AI Chat server. A phone shows a chat with a question, a web search step, an answer with citations, a code block and the composer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.6" stop-color="#d9735b"/>
      <stop offset="1" stop-color="#f6c38a"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="24"/></clipPath>
    <clipPath id="screen"><rect x="0" y="0" width="236" height="470" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <g fill="none" stroke="#0E99AD" stroke-opacity="0.16" stroke-width="1.2">
      <circle cx="1190" cy="30" r="120"/>
      <circle cx="1190" cy="30" r="180"/>
      <circle cx="1190" cy="30" r="240"/>
      <circle cx="1190" cy="30" r="300"/>
    </g>

    <!-- Mark: a speech bubble with a spark -->
    <g transform="translate(72 70)">
      <rect width="56" height="56" rx="16" fill="#F4F7FB"/>
      <path d="M14 18.4A6.1 6.1 0 0 1 20.1 12.3h15.8A6.1 6.1 0 0 1 42 18.4v11.4a6.1 6.1 0 0 1-6.1 6.1h-9.1L19.3 42.4v-6.5A6.1 6.1 0 0 1 14 29.8z" fill="#0B1220"/>
      <path d="M28 16.8l1.85 4.1 4.1 1.85-4.1 1.85L28 28.7l-1.85-4.1-4.1-1.85 4.1-1.85z" fill="#11A3B8"/>
    </g>

    <text x="72" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.4" fill="#F4F7FB">Euron Open AI Chat App</text>
    <text x="74" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#B7C3D3">Your self-hosted AI assistant on iPhone and Android: streaming</text>
    <text x="74" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#B7C3D3">answers that survive the background, offline reading, voice and push.</text>
    <text x="74" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.6" fill="#11A3B8">OPEN SOURCE · REACT NATIVE · ANY SELF-HOSTED SERVER</text>

    <!-- A phone with a chat -->
    <g transform="translate(990 22) rotate(4) scale(0.66)">
      <rect x="-10" y="-10" width="256" height="490" rx="40" fill="#1F2A3D"/>
      <g clip-path="url(#screen)">
        <rect width="236" height="470" fill="#F5F7FA"/>
        <!-- status bar and header -->
        <rect x="88" y="10" width="60" height="16" rx="8" fill="#0B1220"/>
        <rect x="16" y="44" width="14" height="2.4" rx="1.2" fill="#0B1220"/>
        <rect x="16" y="49" width="14" height="2.4" rx="1.2" fill="#0B1220"/>
        <rect x="16" y="54" width="10" height="2.4" rx="1.2" fill="#0B1220"/>
        <rect x="84" y="45" width="68" height="8" rx="4" fill="#0B1220" fill-opacity="0.8"/>
        <!-- question -->
        <rect x="92" y="76" width="128" height="30" rx="15" fill="#E7ECF2"/>
        <rect x="106" y="87" width="96" height="8" rx="4" fill="#334155" fill-opacity="0.75"/>
        <!-- tool step -->
        <circle cx="22" cy="126" r="5" fill="none" stroke="#0E99AD" stroke-width="1.6"/>
        <rect x="34" y="122" width="96" height="7" rx="3.5" fill="#94A3B8"/>
        <!-- answer with citations -->
        <rect x="16" y="144" width="180" height="8" rx="4" fill="#0B1220" fill-opacity="0.78"/>
        <rect x="202" y="142" width="6" height="6" rx="1" fill="#0E99AD"/>
        <rect x="16" y="160" width="196" height="8" rx="4" fill="#0B1220" fill-opacity="0.78"/>
        <rect x="16" y="176" width="150" height="8" rx="4" fill="#0B1220" fill-opacity="0.78"/>
        <rect x="172" y="174" width="6" height="6" rx="1" fill="#0E99AD"/>
        <!-- code block -->
        <rect x="16" y="196" width="204" height="62" rx="8" fill="#E7ECF2"/>
        <rect x="28" y="208" width="44" height="6" rx="3" fill="#7C3AED" fill-opacity="0.8"/>
        <rect x="78" y="208" width="70" height="6" rx="3" fill="#2563EB" fill-opacity="0.8"/>
        <rect x="40" y="222" width="100" height="6" rx="3" fill="#0F766E" fill-opacity="0.8"/>
        <rect x="28" y="236" width="26" height="6" rx="3" fill="#475569" fill-opacity="0.8"/>
        <!-- generated image -->
        <rect x="16" y="270" width="120" height="96" rx="10" fill="url(#img)"/>
        <polygon points="72,290 78,290 82,344 68,344" fill="#F3EFE6"/>
        <rect x="16" y="344" width="120" height="22" fill="#1E3A5F"/>
        <!-- answer actions -->
        <rect x="16" y="378" width="10" height="10" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
        <rect x="36" y="378" width="10" height="10" rx="5" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
        <rect x="56" y="378" width="10" height="10" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
        <!-- composer -->
        <rect x="12" y="410" width="212" height="42" rx="21" fill="#FFFFFF" stroke="#CBD5E1"/>
        <rect x="28" y="428" width="96" height="7" rx="3.5" fill="#94A3B8"/>
        <circle cx="204" cy="431" r="12" fill="#0B1220"/>
        <path d="M204 436v-9m-4 4l4-4 4 4" fill="none" stroke="#F4F7FB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
