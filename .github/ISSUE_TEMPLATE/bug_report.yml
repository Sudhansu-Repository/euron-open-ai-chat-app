name: Bug report
description: Something in the app does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Say whether the server used real models or the local stand-ins.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up && make demo in euron-open-ai-chat, pnpm ios
        2. Sign in as priya.nair@example.com, start a new chat ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["iOS", "Android", "Both"]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone 17 simulator, Pixel 9, ..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "iOS 26.0, Android 16"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version and build
      description: Settings, About, or the commit you built.
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: The euron-open-ai-chat version or commit the app talked to.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Welcome and server picker", "Sign in and account", "Chat and streaming", "Background and resume", "Markdown, code and math", "Web search and sources", "Attachments", "Images", "Projects", "Voice (dictation, read aloud)", "Offline reading", "Push notifications", "Settings", "Build and setup", "Other"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Metro, Xcode or logcat output. Redact tokens, keys, hostnames and chat content before pasting.
      render: text
